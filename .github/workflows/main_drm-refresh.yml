name: Build and deploy Node.js app to Azure Web App - drm-refresh

on:
  push:
    branches:
      - 'main'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm

      - name: Install and build
        run: |
          npm i
          npm run build

      - name: Prepare standalone package
        run: |
          mkdir deploy
          cp -r dist/standalone/. deploy/
          mkdir -p deploy/dist
          cp -r dist/static deploy/dist/static
          if [ -d public ]; then cp -r public deploy/public; fi
          cd deploy
          zip -qr ../app.zip .

      - name: Deploy to Azure Web App (Zip Deploy)
        env:
          KUDU_USER: ${{ secrets.KUDU_USER }}
          KUDU_PASS: ${{ secrets.KUDU_PASS }}
        run: |
          curl --fail-with-body -sS --max-time 600 -X POST \
            -u "$KUDU_USER:$KUDU_PASS" \
            -H "Content-Type: application/zip" \
            --data-binary @app.zip \
            "https://drm-refresh-e6aph2hkemceegb4.scm.westus3-01.azurewebsites.net/api/zipdeploy"