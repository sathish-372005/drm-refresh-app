name: Build and deploy Node.js app to Azure Web App - drm-refresh

on:
  push:
    branches:
      - 'main'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Install and build
        run: |
          npm i
          npm run build

      - name: Prepare standalone package
        run: |
          mkdir -p deploy
          cp -r dist/standalone/* deploy/
          cp -r dist/static deploy/dist/static
          cp -r public deploy/
          cp -r .env.production deploy/
          cd deploy
          zip -r ../app.zip .
          cd ..

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'drm-refresh'
          package: app.zip
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_DE2B9BAA483D47C089323DF4E73F7696 }}