name: Build and deploy Node.js app to Azure Web App - drm-refresh

on:
  push:
    branches:
      - 'main'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm

      - name: Install and build
        run: |
          npm i
          npm run build

      - name: Prepare standalone package
        run: |
          mkdir deploy
          cp -r dist/standalone/. deploy/
          mkdir -p deploy/dist
          cp -r dist/static deploy/dist/static
          if [ -d public ]; then cp -r public deploy/public; fi
          cd deploy
          zip -qr ../app.zip .

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'drm-refresh'
          slot-name: 'Production'
          package: app.zip
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_DE2B9BAA483D47C089323DF4E73F7696 }}